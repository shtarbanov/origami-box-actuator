"Arial" font-size="16" fill="#243d50">Section plot: Y and Z use different scales. Blue / red are bottom / top film. All face metrics are checked in 3D.</text><text x="25" y="606" font-family="Arial" font-size="20" fill="#243d50">Exact local patch distance error ≤ 3.55e-15 mm. No material growth in this witness.</text><text x="25" y="652" font-family="Arial" font-size="21" fill="#243d50">LIMIT: free lateral edges. This does not attach the side gussets or preserve a complete prior long weld.</text><text x="25" y="697" font-family="Arial" font-size="20" fill="#243d50">The full-pouch numerical searches did not produce a metric-certified, contact-safe path.</text><text x="25" y="735" font-family="Arial" font-size="18" fill="#243d50">No numerical failure is treated as proof that an inextensible global path is impossible.</text></svg>