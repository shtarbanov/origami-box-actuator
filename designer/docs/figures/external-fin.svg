<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1080" viewBox="0 0 1500 1080"><rect width="1500" height="1080" fill="#f6f8fa"/><g font-family="Arial, sans-serif"><text x="35" y="45" font-size="30" fill="#172b3a" font-weight="700">External-fin sealing: a local research candidate</text><text x="35" y="78" font-size="18" fill="#334155" font-weight="400">Actual kernel coordinates • fixed orthographic scale • zero-thickness film • not a complete fabrication guide</text><rect x="35" y="100" width="18" height="12" fill="#dc5266"/><text x="62" y="112" font-size="16" fill="#334155" font-weight="400">first free margin</text><rect x="240" y="100" width="18" height="12" fill="#d6921b"/><text x="267" y="112" font-size="16" fill="#334155" font-weight="400">far free margin</text><rect x="443" y="100" width="18" height="12" fill="#dce8ed" stroke="#486779"/><text x="470" y="112" font-size="16" fill="#334155" font-weight="400">rigid panels</text><text x="700" y="112" font-size="16" fill="#334155" font-weight="400">No change to panel lengths or areas.</text><rect x="25" y="135" width="475" height="380" rx="12" fill="white" stroke="#d4dde3"/><text x="43" y="169" font-size="22" fill="#172b3a" font-weight="700">1  First pair folded up</text><polygon points="94.15427620671304,306.4379812022334 115.82197290108832,311.1861128605406 197.2151578915692,251.75716784289853 175.5474611971939,247.0090361845913" fill="#dce8ed" fill-opacity=".88" stroke="#486779" stroke-width="1.4"/><polygon points="115.82197290108837,311.18611286054073 94.15427620671312,306.43798120223346 175.5474611971939,247.0090361845913 197.2151578915692,251.75716784289855" fill="#dce8ed" fill-opacity=".88" stroke="#486779" stroke-width="1.4"/><polygon points="465,267.23322614125675 202.63601990690137,223.49065332360246 45.000000000000114,338.5880335396834 262.14230336152394,374.7910329499461 437.15784693806813,293.9523791170654" fill="#98aebc" fill-opacity=".28" stroke="#98aebc" stroke-width="1.3"/><polygon points