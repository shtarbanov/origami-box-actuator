ints="584.154276206713,306.4379812022334 605.8219729010883,311.1861128605406 687.2151578915692,251.75716784289853 665.5474611971939,247.0090361845913" fill="#dce8ed" fill-opacity=".88" stroke="#486779" stroke-width="1.4"/><polygon points="605.8219729010884,311.18611286054073 584.1542762067131,306.43798120223346 665.5474611971939,247.0090361845913 687.2151578915692,251.75716784289855" fill="#dce8ed" fill-opacity=".88" stroke="#486779" stroke-width="1.4"/><polygon points="955,267.23322614125675 692.6360199069013,223.49065332360246 535.0000000000001,338.5880335396834 752.1423033615239,374.7910329499461 927.1578469380681,293.9523791170654" fill="#98aebc" fill-opacity=".28" stroke="#98aebc" stroke-width="1.3"/><polygon points="613.4709228913674,313.08079498943295 724.0824243144681,343.8361880680512 834.9831690472843,292.6117840519364 694.8641078818483,253.65184997179085" fill="#dce8ed" fill-opacity=".88" stroke="#486779" stroke-width="1.4"/><polygon points="694.8641078818483,253.6518499717909 834.9831690472842,292.61178405193647 724.0824243144681,343.83618806805123 613.4709228913674,313.080794989433" fill="#dce8ed" fill-opacity=".88" stroke="#486779" stroke-width="1.4"/><polygon points="692.6360199069013,223.49065332360243 878.6168059242179,275.20238406988074 663.8328285379422,374.4098444014528 535,338.58803353968347" fill="#98aebc" fill-opacity=".28" stroke="#98aebc" stroke-width="1.3"/><polygon points="878.6168059242179,275.20238406988074 879.4152756911817,285.3677509532808 667.0475708576781,415.3369232562702 663.8328285379422,374.4098444014528" fill="#dc5266" fill-opacity=".28" stroke="#dc5266" stroke-width="1.3"/><polygon points="731.1874902493356,346.04384207444343 749.8638246389469,352.51331905900076 860.7645693717631,301.2889150428861 842.0882349821518,294.8194380583288" fill="#dce8ed" fill-opacity=".88" stroke="#486779" stroke-width="1.4"/><polygon points="756.6552189624418,354.8658561442943 775.3315533520532,361.3353331288517 886.2322980848695,310.11092911273704 867.5559636952582,303.6414521281797" fill="#dce8ed" fill-opacity=".88" stroke="#486779" stroke-width="1.4"/><polygon points="752.1423033615239,374.7910329499461 829.4847000084028,387.6859258236459 927.1578469380681,293.9523791170654" fill="#d6921b" fill-opacity=".28" stroke="#d6921b" stroke-width="1.3"/><text x="533" y="472" font-size="16" fill="#334155" font-weight="400">Prepare it before the last panel closes.</text><text x="533" y="496" font-size="16" fill="#334155" font-weight="400">This avoids extracting a buried layer later.</text><rect x="1005" y="135" width="475" height="380" rx="12" fill="white" stroke="#d4dde3"/><text x="1023" y="169" font-size="22" fill="#172b3a" font-weight="700">3  Far free margin up</text><polygon points="1074.1542762067131,306.4379812022334 1095.8219729010884,311.1861128605406 1177.215157891569,251.75716784289853 1155.5474611971938,247.0090361845913" fill="#dce8ed" fill-opacity=".88" stroke="#486779" stroke-width="1.4"/><polygon points="1095.8219729010884,311.18611286054073 1074.1542762067131,306.43798120223346 1155.5474611971938,247.0090361845913 1177.215157891569,251.75716784289855" fill="#dce8ed" fill-opacity=".88" stroke="#486779" stroke-width="1.4"/><polygon points="1445,267.23322614125675 1182.6360199069013,223.49065332360246 1025,338.5880335396834 1242.142303361524,374.7910329499461 1417.1578469380681,293.9523791170654" fill="#98aebc" fill-opacity=".28" stroke="#98aebc" stroke-width="1.3"/><polygon points="1103.4709228913675,313.08079498943295 1214.0824243144682,343.8361880680512 1324.9831690472843,292.6117840519364 1184.8641078818484,253.65184997179085" fill="#dce8ed" fill-opacity=".88" stroke="#486779" stroke-width="1.4"/><polygon points="1184.8641078818484,253.6518499717909 1324.9831690472843,292.61178405193647 1214.0824243144682,343.83618806805123 1103.4709228913675,313.080794989433" fill="#dce8ed" fill-opacity=".88" stroke="#486779" stroke-width="1.4"/><polygon points="1182.6360199069013,223.49065332360243 1368.616805924218,275.20238406988074 1153.832828537942,374.4098444014528 1025,338.58803353968347" fill="#98aebc" fill-opacity=".28" stroke="#98aebc" stroke-width="1.3"/><polygon points="1368.616805924218,275.20238406988074 1369.4152756911817,285.3677509532808 1157.047570857678,415.3369232562702 1153.832828537942,374.4098444014528" fill="#dc5266" fill-opacity=".28" stroke="#dc5266" stroke-width="1.3"/><polygon points="1221.1874902493355,346.04384207444343 1239.8638246389469,352.51331905900076 1350.7645693717632,301.2889150428861 1332.0882349821518,294.8194380583288" fill="#dce8ed" fill-opacity=".88" stroke="#486779" stroke-width="1.4"/><polygon points="1246.6552189624417,354.8658561442943 1265.331553352053,361.3353331288517 1376.2322980848696,310.11092911273704 1357.5559636952582,303.6414521281797" fill="#dce8ed" fill-opacity=".88" stroke="#486779" stroke-width="1.4"/><polygon points="1242.1423033615238,374.79103294994616 1259.334678946361,293.54657604342583 1417.1578469380681,293.9523791170654" fill="#d6921b" fill-opacity=".28" stroke="#d6921b" stroke-width="1.3"/><text x="1023" y="472" font-size="16" fill="#334155" font-weight="400">Pre-fold the far margin while accessible.</text><text x="1023" y="496" font-size="16" fill="#334155" font-weight="400">Only flexible film bends at this crease.</text><rect x="25" y="530" width="475" height="380" rx="12" fill="white" stroke="#d4dde3"/><text x="43" y="564" font-size="22" fill="#172b3a" font-weight="700">4  Second pair closes DOWN</text><polygon points="94.15427620671304,701.4379812022333 115.82197290108832,706.1861128605406 197.2151578915692,646.7571678428985 175.5474611971939,642.0090361845913" fill="#dce8ed" fill-opacity=".88" stroke="#486779" stroke-width="1.4"/><polygon points="115.82197290108837,706.1861128605407 94.15427620671312,701.4379812022335 175.5474611971939,642.0090361845913 197.2151578915692,646.7571678428985" fill="#dce8ed" fill-opacity=".88" stroke="#486779" stroke-width="1.4"/><polygon points="454.29974424342134,660.4492285191991 202.63601990690137,618.4906533236025 45.000000000000114,733.5880335396834 229.39526286103117,764.3312903315151" fill="#98aebc" fill-opacity=".28" stroke="#98aebc" stroke-width="1.3"/><polygon points="123.47092289136742,708.080794989433 234.08242431446808,738.8361880680511 344.98316904728426,687.6117840519364 204.86410788184833,648.6518499717909" fill="#dce8ed" fill-opacity=".88" stroke="#486779" stroke-width="1.4"/><polygon points="204.86410788184835,648.6518499717909 344.98316904728415,687.6117840519365 234.08242431446808,738.8361880680512 123.47092289136742,708.080794989433" fill="#dce8ed" fill-opacity=".88" stroke="#486779" stroke-width="1.4"/><polygon points="202.63601990690137,618.4906533236024 388.61680592421794,670.2023840698807 173.8328285379422,769.4098444014528 45,733.5880335396835" fill="#98aebc" fill-opacity=".28" stroke="#98aebc" stroke-width="1.3"/><polygon points="456.6782949969082,669.4920537371707 454.29974424342134,660.4492285191992 229.39526286103117,764.331290331515 236.67457464841766,792.0059338529782 411.6901182249616,711.1672800200976" fill="#98aebc" fill-opacity=".28" stroke="#98aebc" stroke-width="1.3"/><polygon points="388.616805924218,670.2023840698807 389.41527569118165,680.3677509532808 177.0475708576781,810.3369232562702 173.8328285379422,769.4098444014528" fill="#dc5266" fill-opacity=".28" stroke="#dc5266" stroke-width="1.3"/><polygon points="241.18749024933555,741.0438420744434 259.8638246389469,747.5133190590008 370.7645693717631,696.2889150428862 352.08823498215173,689.8194380583287" fill="#dce8ed" fill-opacity=".88" stroke="#486779" stroke-width="1.4"/><polygon points="263.2595218006945,752.8278429313651 263.2595218006945,775.5882472448127 374.1602665335107,724.3638432286982 374.16026653351065,701.6034389152506" fill="#dce8ed" fill-opacity=".88" stroke="#486779" stroke-width="1.4"/><polygon points="236.67457464841766,792.005933852978 314.01697129529674,804.9008267266778 411.6901182249617,711.1672800200976" fill="#d6921b" fill-opacity=".28" stroke="#d6921b" stroke-width="1.3"/><text x="43" y="867" font-size="16" fill="#334155" font-weight="400">Shown halfway through the second fold.</text><text x="43" y="891" font-size="16" fill="#334155" font-weight="400">The pre-folded margin travels with it.</text><rect x="515" y="530" width="475" height="380" rx="12" fill="white" stroke="#d4dde3"/><text x="533" y="564" font-size="22" fill="#172b3a" font-weight="700">5  Margins meet below body</text><polygon points="584.154276206713,701.4379812022333 605.8219729010883,706.1861128605406 687.2151578915692,646.7571678428985 665.5474611971939,642.0090361845913" fill="#dce8ed" fill-opacity=".88" stroke="#486779" stroke-width="1.4"/><polygon points="605.8219729010884,706.1861128605407 584.1542762067131,701.4379812022335 665.5474611971939,642.0090361845913 687.2151578915692,646.7571678428985" fill="#dce8ed" fill-opacity=".88" stroke="#486779" stroke-width="1.4"/><polygon points="944.2997442434214,660.4492285191991 692.6360199069013,618.4906533236025 535.0000000000001,733.5880335396834 719.3952628610311,764.3312903315151" fill="#98aebc" fill-opacity=".28" stroke="#98aebc" stroke-width="1.3"/><polygon points="613.4709228913674,708.080794989433 724.0824243144681,738.8361880680511 834.9831690472843,687.6117840519364 694.8641078818483,648.6518499717909" fill="#dce8ed" fill-opacity=".88" stroke="#486779" stroke-width="1.4"/><polygon points="694.8641078818483,648.6518499717909 834.9831690472842,687.6117840519365 724.0824243144681,738.8361880680512 613.4709228913674,708.080794989433" fill="#dce8ed" fill-opacity=".88" stroke="#486779" stroke-width="1.4"/><polygon points="692.6360199069013,618.4906533236024 878.6168059242179,670.2023840698807 663.8328285379422,769.4098444014528 535,733.5880335396835" fill="#98aebc" fill-opacity=".28" stroke="#98aebc" stroke-width="1.3"/><polygon points="938.3565899938164,656.4679535918721 944.2997442434213,660.4492285191991 719.3952628610313,764.3312903315151 701.2068459353114,752.1470048102443 876.2223895118551,671.3083509773635" fill="#98aebc" fill-opacity=".28" stroke="#98aebc" stroke-width="1.3"/><polygon points="878.6168059242179,670.2023840698807 879.4152756911817,680.3677509532808 667.0475708576781,810.3369232562702 663.8328285379422,769.4098444014528" fill="#dc5266" fill-opacity=".28" stroke="#dc5266" stroke-width="1.3"/><polygon points="701.2068459353114,752.1470048102444 718.3992215201487,817.5093466763976 876.2223895118552,671.3083509773635" fill="#d6921b" fill-opacity=".28" stroke="#d6921b" stroke-width="1.3"/><polygon points="749.863824638947,747.5133190590008 731.1874902493357,741.0438420744434 842.0882349821518,689.8194380583287 860.7645693717632,696.2889150428861" fill="#dce8ed" fill-opacity=".88" stroke="#486779" stroke-width="1.4"/><polygon points="731.1874902493356,741.0438420744434 749.8638246389469,747.5133190590008 860.7645693717631,696.2889150428862 842.0882349821518,689.8194380583287" fill="#dce8ed" fill-opacity=".88" stroke="#486779" stroke-width="1.4"/><text x="533" y="867" font-size="16" fill="#334155" font-weight="400">Body film remains in the z = 0 plane.</text><text x="533" y="891" font-size="16" fill="#334155" font-weight="400">The red and gold margins form a fin.</text><rect x="1005" y="530" width="475" height="380" rx="12" fill="white" stroke="#d4dde3"/><text x="1023" y="564" font-size="22" fill="#172b3a" font-weight="700">6  Heat outside the body</text><text x="1023" y="592" font-size="16" fill="#334155" font-weight="400">Magnified section normal to the seam</text><path d="M1040 642L1440 642" fill="none" stroke="#78909c" stroke-width="7"/><text x="1027" y="627" font-size="15" fill="#334155" font-weight="400">body film / panels</text><path d="M1240 642L1240 794" fill="none" stroke="#dc5266" stroke-width="6"/><path d="M1240 642L1240 794" fill="none" stroke="#d6921b" stroke-width="6" stroke-dasharray="7 7"/><rect x="1174" y="680" width="62" height="19" rx="2" fill="#6b7785"/><rect x="1244" y="680" width="62" height="19" rx="2" fill="#6b7785"/><path d="M1135 689.5L1170 689.5" fill="none" stroke="#b75133" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1345 689.5L1310 689.5" fill="none" stroke="#b75133" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1365 642L1365 680" fill="none" stroke="#334155" stroke-width="1"/><text x="1374" y="667" font-size="18" fill="#334155" font-weight="400">s</text><path d="M1365 680L1365 699" fill="none" stroke="#b75133" stroke-width="3"/><text x="1374" y="696" font-size="18" fill="#b75133" font-weight="400">b</text><text x="1023" y="816" font-size="15" fill="#334155" font-weight="400">Two coincident margins; no layer gap drawn.</text><text x="1023" y="840" font-size="17" fill="#172b3a" font-weight="700">Required free depth: at least s + b.</text><text x="1023" y="864" font-size="16" fill="#334155" font-weight="400">Seal first; trim beyond the weld afterward.</text><text x="1023" y="885" font-size="15" fill="#923b2e" font-weight="400">Setback permits root separation up to 2s.</text><text x="1023" y="904" font-size="13" fill="#334155" font-weight="400">Jaw bodies are illustrative, not collision-checked.</text><rect x="25" y="935" width="1455" height="117" rx="10" fill="#fff1db"/><text x="45" y="963" font-size="19" fill="#6b4313" font-weight="700">What this establishes</text><text x="45" y="989" font-size="17" fill="#334155" font-weight="400">The example has no sampled film crossing, no stack-order violation, and exactly two film layers cover the local heated band.</text><text x="45" y="1014" font-size="16" fill="#334155" font-weight="400">Example inputs only: front/rear width 80/64 mm; length 75 mm; rise 30 mm; blank expansion m = 8 mm; s = 2 mm; b = 1 mm.</text><text x="45" y="1039" font-size="17" fill="#923b2e" font-weight="700">Not established: end-seal junctions, complete jaw clearance, finite thickness, airtightness or inflation after sealing.</text></g><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto-start-reverse"><path d="M0 0L6 3L0 6Z" fill="#b75133"/></marker></defs></svg>