<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470"><rect width="1200" height="470" fill="#f7fafb"/><text x="25" y="35" font-family="Arial" font-size="26" fill="#263e50">Local plastic cross-sections: real thickness and layer order</text><text x="30" y="78" font-family="Arial" font-size="20" fill="#263e50">After the first three folds</text><rect x="40" y="310" width="255" height="60" fill="#668fa9" stroke="#425e70"/><text x="312" y="346" font-family="Arial" font-size="18" fill="#263e50">bottom</text><rect x="40" y="235.35609359944468" width="255" height="60.00000000000066" fill="#d59b55" stroke="#425e70"/><text x="312" y="271.356093599445" font-family="Arial" font-size="18" fill="#263e50">right-lower</text><rect x="40" y="175.35609359944434" width="255" height="60.00000000000094" fill="#edc17a" stroke="#425e70"/><text x="312" y="211.35609359944482" font-family="Arial" font-size="18" fill="#263e50">right-upper</text><rect x="40" y="115.35209359944434" width="255" height="60.00000000000183" fill="#85a6c4" stroke="#425e70"/><text x="312" y="151.35209359944525" font-family="Arial" font-size="18" fill="#263e50">top</text><text x="40" y="405" font-family="Arial" font-size="15" fill="#263e50">Uniform scale: 200 px/mm; cropped section window.</text><text x="620" y="78" font-family="Arial" font-size="20" fill="#263e50">After the opposite wall is tucked inward</text><rect x="630" y="310" width="255" height="60" fill="#668fa9" stroke="#425e70"/><text x="902" y="346" font-family="Arial" font-size="18" fill="#263e50">bottom</text><rect x="630" y="242.67604679972396" width="255" height="60" fill="#64aaa0" stroke="#425e70"/><text x="902" y="278.67604679972396" font-family="Arial" font-size="18" fill="#263e50">left-lower</text><rect x="630" y="182.67604679972396" width="255" height="60.00000000000001" fill="#9acbc2" stroke="#425e70"/><text x="902" y="218.67604679972396" font-family="Arial" font-size="18" fill="#263e50">left-upper</text><rect x="630" y="115.35209359944793" width="255" height="60.00000000000001" fill="#85a6c4" stroke="#425e70"/><text x="902" y="151.35209359944793" font-family="Arial" font-size="18" fill="#263e50">top</text><text x="630" y="405" font-family="Arial" font-size="15" fill="#263e50">Uniform scale: 200 px/mm; cropped section window.</text><text x="25" y="448" font-family="Arial" font-size="17" fill="#263e50">Each plastic layer is 0.30 mm. No artificial explosion or thickness magnification is applied.</text></svg>