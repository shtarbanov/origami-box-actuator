name: Designer checks
on:
  push:
    paths: ['designer/**', '.github/workflows/designer-tests.yml']
  pull_request:
    paths: ['designer/**', '.github/workflows/designer-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
        working-directory: designer
