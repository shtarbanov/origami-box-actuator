<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Origami Actuator Design Tool</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#eceae4;--panel:#f7f6f2;--ink:#1d2330;--mute:#5d6577;--line:#cfccc2;--acc:#0b5fd0;--accfg:#fff;--warn:#b3361f;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--panel:#1d212a;--ink:#e8e9ee;--mute:#9aa1b2;--line:#323846;--acc:#6aa3ff;--accfg:#0c1220;--warn:#ff8f78}}
:root[data-theme="dark"]{--bg:#14171d;--panel:#1d212a;--ink:#e8e9ee;--mute:#9aa1b2;--line:#323846;--acc:#6aa3ff;--accfg:#0c1220;--warn:#ff8f78}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 40px;display:grid;grid-template-columns:370px minmax(0,1fr);gap:20px}
@media(max-width:820px){.wrap{grid-template-columns:1fr}}
h1{font:600 22px/1.2 Georgia,"Iowan Old Style",serif;margin:0 0 16px}
.sub{color:var(--mute);margin:0 0 16px;font-size:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.f{margin-bottom:14px}
.f label{display:flex;justify-content:space-between;font-weight:600;font-size:14px}
.f small{display:block;color:var(--mute);font-weight:400;font-size:12.5px;margin-top:1px}
#hint_h,#hint_H{min-height:18px}
#hint_h:not(:empty),#hint_H:not(:empty){cursor:pointer}
.ls{width:34px;flex:none;display:flex;justify-content:center}
.lk,.rst.ic{display:inline-flex;align-items:center;padding:6px 8px}
.rst.on{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.row{display:flex;gap:6px;align-items:center;margin-top:6px}
.row input[type=range]{flex:1 1 0;min-width:0;width:0;accent-color:var(--acc)}
.nw{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding-right:8px}
.nw:focus-within{outline:2px solid var(--acc);outline-offset:-1px}
.num{width:58px;padding:5px 2px 5px 6px;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;text-align:right;-moz-appearance:textfield;appearance:textfield}
.num::-webkit-outer-spin-button,.num::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
select{padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.grp{border:0;border-top:1px solid var(--line);margin:0;padding:14px 0 0;min-width:0}
.grp:first-child{border-top:0;padding-top:0}
.grp legend{font:600 15px Georgia,"Iowan Old Style",serif;padding:0 0 8px}
details.grp{padding-bottom:0}
details.grp[open] summary{margin-bottom:8px}
.grp summary{font:600 15px Georgia,"Iowan Old Style",serif;cursor:pointer}
.rst{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:6px;padding:4px 8px;font:inherit;font-size:13px;cursor:pointer}
.rst:disabled{opacity:.4;cursor:default}
.u{color:var(--mute);margin-left:3px}
.tip{cursor:help;color:var(--mute);margin-left:2px;font-weight:400}
.derived{border-top:1px dashed var(--line);padding-top:12px;margin-top:4px;font-size:14px}
.derived b{font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px 8px;margin-bottom:14px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line)}
.tab{border:0;border-bottom:3px solid transparent;margin-bottom:-1px;background:transparent;color:var(--mute);padding:10px 16px 9px;font:inherit;font-size:16px;cursor:pointer}
.tab:hover{color:var(--ink)}
.tab[aria-selected=true]{color:var(--ink);font-weight:600;border-bottom-color:var(--acc)}
.sp{flex:1}
.btn{border:0;background:var(--acc);color:var(--accfg);padding:7px 13px;border-radius:7px;font:inherit;font-weight:600;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.ic{display:inline-flex;align-items:center;padding:5px 9px}
.eye{display:inline-flex;align-items:center;border:0;background:transparent;color:var(--ink);padding:6px 7px;border-radius:6px;cursor:pointer}
.eye:hover{background:var(--line)}
.eye.off{color:var(--mute)}
.eye:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.sheet{background:#d9d7d0;border:1px solid var(--line);border-radius:4px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.sheet svg{display:block;width:100%;height:auto}
.sheetwrap{position:relative}
.sheet.pannable{cursor:grab;user-select:none}
.sheet.pannable.panning{cursor:grabbing}
.sheet.zoomed{touch-action:none}
.zc{position:absolute;right:10px;bottom:10px;display:flex;gap:4px;padding:3px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.zc .rst{min-width:36px;font-variant-numeric:tabular-nums}
.ft{max-width:1180px;margin:-16px auto 0;padding:0 16px 24px;text-align:center}
.lnk{border:0;background:transparent;color:var(--acc);font:inherit;font-size:14px;cursor:pointer;padding:2px 0;text-decoration:underline}
dialog.about{width:min(640px,calc(100% - 24px));max-height:calc(100% - 48px);border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);padding:0;overflow:hidden}
dialog.about[open]{display:flex;flex-direction:column}
dialog.about::backdrop{background:rgba(0,0,0,.45)}
.ab-h{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)}
.ab-h h2{font:600 18px Georgia,"Iowan Old Style",serif;margin:0}
.ab-b{overflow:auto;padding:4px 18px 18px}
.ab-b details{border-top:1px solid var(--line);padding:10px 0}
.ab-b details:first-child{border-top:0}
.ab-b summary{font:600 16px Georgia,"Iowan Old Style",serif;cursor:pointer}
.ab-b details[open] summary{margin-bottom:8px}
.ab-b ol{margin:0;padding-left:22px}
.ab-b ol li{margin-bottom:8px}
.ab-b .src{color:var(--mute);font-size:12.5px;border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
.ab-b p,.ab-b li{font-size:14px;margin:0 0 6px}
.ab-b ul{margin:0;padding-left:20px}
.ab-b ul.cl{list-style:none;padding:0}
.ab-b ul.cl li{margin-bottom:8px}
.ab-b .cr{color:var(--mute)}
.ab-b a{color:var(--acc)}
#msg{min-height:20px;margin-top:10px;font-size:13.5px;color:var(--mute)}
#msg.bad{color:var(--warn)}
</style>
</head>
<body>
<div class="wrap">
 <section>
  <h1>Origami Actuator Design Tool</h1>
  <div class="card" id="ctl"></div>
 </section>
 <section>
  <div class="tabs">
   <button class="tab" role="tab" data-pg="1" aria-selected="true">Cutting</button>
   <button class="tab" role="tab" data-pg="2" aria-selected="false">Folding</button>
   <span class="sp"></span>
   <select id="paper" aria-label="Paper size (landscape)" title="Paper size (landscape)"><option>A4</option><option>Letter</option><option>A3</option></select>
   <button class="eye" id="scaleguide" type="button" aria-pressed="true" aria-label="Scale guide"></button>
   <button class="btn ic" id="dlpdf" aria-label="Download PDF" title="Download PDF"><svg viewBox="0 0 46 22" width="46" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.5 3v10M3.5 9.5l4 4 4-4M3 18.5h9"/><text x="17" y="15.6" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="currentColor" stroke="none">PDF</text></svg></button>
   <button class="btn alt ic" id="dlsvg" aria-label="Download SVG" title="Download SVG"><svg viewBox="0 0 46 22" width="46" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.5 3v10M3.5 9.5l4 4 4-4M3 18.5h9"/><text x="17" y="15.6" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="currentColor" stroke="none">SVG</text></svg></button>
  </div>
  <div class="sheetwrap">
   <div class="sheet" id="sheet"></div>
   <div class="zc" role="group" aria-label="Zoom">
    <button class="rst" id="zout" aria-label="Zoom out" title="Zoom out">−</button>
    <button class="rst" id="zfit" aria-label="Reset zoom" title="Reset zoom (double-click the page also resets)">100%</button>
    <button class="rst" id="zin" aria-label="Zoom in" title="Zoom in (or Ctrl/⌘ + scroll, or pinch)">+</button>
   </div>
  </div>
  <div id="msg" role="status"></div>
 </section>
</div>
<footer class="ft"><button type="button" class="lnk" id="aboutBtn">About</button></footer>
<dialog class="about" id="about" aria-labelledby="about-h">
 <div class="ab-h"><h2 id="about-h">About</h2><button type="button" class="btn alt" id="aboutClose">Close</button></div>
 <div class="ab-b">
  <p>This tool generates printable cutting and folding stencils for making an origami-based chamber actuator as explained in this <a href="https://www.softrobotics.io/post/origami-based-chamber-actuators" target="_blank" rel="noopener noreferrer">tutorial</a> on the SoftRobotics.IO website.</p>
  <details><summary>Contributors</summary>
   <ul class="cl" id="contribList"></ul>
  </details>
  <p class="src">Licensed under <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank" rel="noopener noreferrer">CC BY-NC-SA 4.0</a>.</p>
 </div>
</dialog>
<script>
const PAPERS={A4:[297,210],Letter:[279.4,215.9],A3:[420,297]};
// Panel gap slider range (mm). An unlocked gap gives way down to GAP_MIN before Width or Height have to move.
const GAP_MIN=1, GAP_MAX=7;
const FIELDS=[
 {k:'H',name:'Length',hint:'',min:10,max:150,step:0.5},
 {k:'W',name:'Width',hint:'',min:10,max:100,step:0.5},
 {k:'h',name:'Height',hint:'',tip:'Height = 2 × folding panel height + 3 × panel gap. The slider spans 4–75 mm, but the allowable range depends on Width and Panel gap.',min:4,max:75,step:0.1},
 {k:'g',name:'Panel gap',hint:'',tip:'Gap between neighboring panels on the Folding page. The slider spans 1–7 mm, but the allowable range depends on Width.',min:GAP_MIN,max:GAP_MAX,step:0.25},
 {k:'x',name:'Inlet position X',hint:'',tip:'Horizontal offset of the inlet from the center of the bottom panel. Positive values move it right, negative values move it left.',min:-20,max:20,step:0.25},
 {k:'d',name:'Inlet position Y',hint:'',tip:'Vertical offset of the inlet from the point midway between the bottom edge of the panels and the sealing line. Positive values move it down, negative values move it up.',min:-10,max:10,step:0.25}
];
// State. Locks: wL / gL / hL / HL hold the locked value of Width / Panel gap / Height / Length (null = unlocked).
// For Height (h = 2*s + 3*g), Length and Inlet Y, want* is the value the user last asked for and the plain value (s, H, d) is what currently fits after clamping.
const P={gL:4,wL:null,hL:null,HL:null,H:75,wantH:75,W:48,h:60,s:24,wantS:24,g:4,d:0,wantD:0,x:0,paper:'A4'};
const DEF={...P};
const ICON_LOCK='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10.5" rx="2.5"/><circle cx="12" cy="15.75" r="1.3" fill="currentColor" stroke="none"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg>';
const ICON_RESET='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>';
// Push P[k] into the slider and number box (the box is left alone while being typed in); optionally set the allowed range (+-lim) and the lock state
function syncField(k,o={}){
 const r=document.getElementById('r_'+k),n=document.getElementById('n_'+k);
 if(!r)return;
 if(o.lim!=null){r.min=n.min=-o.lim;r.max=n.max=o.lim}
 r.value=P[k];if(document.activeElement!==n)n.value=fmt(k,P[k]);
 if(o.locked!=null){r.disabled=n.disabled=o.locked;lockUI(k,o.locked,o.name)}
}
const ICON_OPEN='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10.5" rx="2.5"/><circle cx="12" cy="15.75" r="1.3" fill="currentColor" stroke="none"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 6.4-2"/></svg>';
function lockUI(k,on,name){const b=document.getElementById('lock_'+k);if(!b)return;b.innerHTML=on?ICON_LOCK:ICON_OPEN;b.setAttribute('aria-pressed',String(on));b.setAttribute('aria-label',(on?'Unlock ':'Lock ')+name);b.title=on?'Unlock '+name:'Lock '+name+' (keep '+name+' fixed while other settings change)';b.classList.toggle('on',on)}
// Edit this list to change who is shown under About → Contributors. `url` is optional.
const CONTRIBUTORS=[
 {name:'Ali Shtarbanov',role:'',url:''},
 {name:'Yoon Jong-hwan',role:'',url:''}
];
let page=1;
const CHAMFER=1; // mm cut off each corner of a panel (a 45-degree cut of CHAMFER mm on each leg)
const SEAL_LW=0.18, PANEL_LW=0.15, FOLD_LW=0.1, DASH=[1.5,1];

// Number boxes: while a slider is being dragged every value shows a fixed number of decimals (so digits don't jump around);
// once released, trailing zeros are dropped (49.0 -> 49, 4.50 -> 4.5). Panel gap and the inlet positions move in 0.25 steps, so they need 2 decimals.
const DECIMALS={H:1,W:1,h:1,g:2,x:2,d:2};
let sliding=false;
const fmt=(k,v)=>sliding?(+v).toFixed(DECIMALS[k]):String(+(+v).toFixed(DECIMALS[k]));
// Round x to a multiple of 1/n with the given rounding function (Math.floor / Math.round / Math.ceil)
const snap=(fn,x,n)=>fn(x*n)/n;
// Longest length allowed for the current settings: the sealing lines (one folding panel height + gap beyond each end of the panels) must still fit the paper height
function hmFor(){return Math.min(150,Math.max(10,snap(Math.floor,PAPERS[P.paper][1]-2*(P.s+P.g),2)))}
// Folding page width rule (6 panels side by side: 2 Top/Bottom panels of Width W + 4 folding panels of Height s, 5 gaps g) must fit the paper width.
// foldTotal is the rule itself; maxS / maxG are the same rule solved for s and g.
const foldTotal=(W,s,g)=>2*W+4*s+5*g;
const maxS=(W,g)=>(PAPERS[P.paper][0]-2*W-5*g)/4;
const maxG=(W,s)=>(PAPERS[P.paper][0]-2*W-4*s)/5;
// Outline of a panel with its four corners chamfered by c (a 45-degree cut of c mm on each leg)
const chamfered=(x,y,w,h,c)=>[[x+c,y],[x+w-c,y],[x+w,y+c],[x+w,y+h-c],[x+w-c,y+h],[x+c,y+h],[x,y+h-c],[x,y+c]];
// Outline of the Cutting page's strip of touching panels with every panel's corners chamfered: the outer corners are cut, and each joint between two panels gets a V notch
const stripOutline=(xs,ws,y,h,c)=>{
 const pts=[[xs[0],y+c]];
 xs.forEach((x,i)=>pts.push([x+c,y],[x+ws[i]-c,y],[x+ws[i],y+c]));
 pts.push([xs[xs.length-1]+ws[ws.length-1],y+h-c]); // down the right edge to the start of the bottom-right chamfer
 for(let i=xs.length-1;i>=0;i--)pts.push([xs[i]+ws[i]-c,y+h],[xs[i]+c,y+h],[xs[i],y+h-c]);
 return pts;
};
function build(p,pg){
 const [PW,PH]=PAPERS[p.paper], g=pg===2?p.g:0;
 const s=p.s, ws=[p.W,s,s,p.W,s,s];
 const total=ws.reduce((a,b)=>a+b,0)+5*g;
 const x0=(PW-total)/2, y0=(PH-p.H)/2, it=[];
 const xs=[];let x=x0;ws.forEach(w=>{xs.push(x);x+=w+g});
 [0,3].forEach(i=>it.push({k:'poly',pts:chamfered(xs[i],y0,p.W,p.H,CHAMFER),fill:'#f2f2f2'}));
 // Vertical panel label: the word "panel" goes on a second line; if the panel is too narrow for two lines, only the first word is shown
 const label=(cx,pw,first)=>{
  const cy=y0+p.H/2;
  if(pw>=8){it.push({k:'text',x:cx-0.8,y:cy,rot:1,t:first});it.push({k:'text',x:cx+3,y:cy,rot:1,t:'panel'})}
  else it.push({k:'text',x:cx+1.1,y:cy,rot:1,t:first});
 };
 [0,3].forEach(i=>label(xs[i]+p.W/2,p.W,'Top / Bottom'));
 [1,2,4,5].forEach(i=>label(xs[i]+s/2,s,'Folding'));
 if(pg===1){
  it.push({k:'poly',pts:stripOutline(xs,ws,y0,p.H,CHAMFER),lw:PANEL_LW});
  for(let i=1;i<6;i++)it.push({k:'line',x1:xs[i],y1:y0+CHAMFER,x2:xs[i],y2:y0+p.H-CHAMFER,lw:PANEL_LW});
  const inT=y0<13, inL=x0<13, inB=y0<14; // dimension no longer fits outside the panels -> draw it inside
  const dy=inT?y0+8:y0-9, xr=x0+total, ar=2.2, ab=0.7, dl=0.15;
  [[x0,1],[xr,-1]].forEach(([ex,s])=>{
   if(!inT)it.push({k:'line',x1:ex,y1:y0-1.5,x2:ex,y2:dy-2,lw:dl});
   it.push({k:'line',x1:ex,y1:dy,x2:ex+s*ar,y2:dy-ab,lw:dl});
   it.push({k:'line',x1:ex,y1:dy,x2:ex+s*ar,y2:dy+ab,lw:dl});
  });
  it.push({k:'line',x1:x0,y1:dy,x2:xr,y2:dy,lw:dl,dash:true});
  it.push({k:'text',x:x0+total/2,y:dy-1.4,t:(Math.round(total*100)/100)+' mm'});
  const dx=inL?x0+9:x0-9;
  [[y0,1],[y0+p.H,-1]].forEach(([ey,s])=>{
   if(!inL)it.push({k:'line',x1:x0-1.5,y1:ey,x2:dx-2,y2:ey,lw:dl});
   it.push({k:'line',x1:dx,y1:ey,x2:dx-ab,y2:ey+s*ar,lw:dl});
   it.push({k:'line',x1:dx,y1:ey,x2:dx+ab,y2:ey+s*ar,lw:dl});
  });
  it.push({k:'line',x1:dx,y1:y0,x2:dx,y2:y0+p.H,lw:dl,dash:true});
  it.push({k:'text',x:dx-1.4,y:y0+p.H/2,rot:1,t:(Math.round(p.H*100)/100)+' mm'});
  it.push({k:'text',x:dx+3.6,y:y0+p.H/2,rot:1,t:'(Length)'});
  const by=inB?y0+p.H-9:y0+p.H+9;
  const dim=(xa,xb,v,above,lb,fx)=>{
   [[xa,1],[xb,-1]].forEach(([ex,sg])=>{
    if(!inB)it.push({k:'line',x1:ex,y1:y0+p.H+1.5,x2:ex,y2:by+2,lw:dl});
    it.push({k:'line',x1:ex,y1:by,x2:ex+sg*ar,y2:by-ab,lw:dl});
    it.push({k:'line',x1:ex,y1:by,x2:ex+sg*ar,y2:by+ab,lw:dl});
   });
   it.push({k:'line',x1:xa,y1:by,x2:xb,y2:by,lw:dl,dash:true});
   it.push({k:'text',x:(xa+xb)/2,y:above?by-1.4:by+3.6,t:(fx?v.toFixed(2):Math.round(v*100)/100)+' mm'});
   if(lb)it.push({k:'text',x:(xa+xb)/2,y:by+3.6,t:'('+lb+')'});
  };
  dim(xs[0],xs[0]+p.W,p.W,true,'Width');
  dim(xs[1],xs[1]+s,s,true,'',true);
  return {it,PW,PH,need:[total,p.H]};
 }
 ws.forEach((w,i)=>it.push({k:'poly',pts:chamfered(xs[i],y0,w,p.H,CHAMFER),lw:PANEL_LW}));
 [1,2,4].forEach(i=>{const fx=xs[i]+ws[i]+g/2;it.push({k:'line',x1:fx,y1:y0,x2:fx,y2:y0+p.H,lw:FOLD_LW})});
 // fold arrows: slanted arrows per folding panel, mirrored across the fold line of each pair (1&2, 4&5) and across the panel's horizontal midline (top/bottom)
 const arrow=(x1,y1,x2,y2)=>{
  const dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy), ux=dx/L, uy=dy/L, ar=Math.min(2.2,0.4*L), ab=0.4*ar;
  it.push({k:'line',x1,y1,x2,y2,lw:SEAL_LW});
  [1,-1].forEach(sg=>it.push({k:'line',x1:x2,y1:y2,x2:x2-ar*ux-sg*ab*uy,y2:y2-ar*uy+sg*ab*ux,lw:SEAL_LW}));
 };
 [1,4].forEach(i=>{
  const fx=xs[i]+s+g/2, mx=x=>2*fx-x;
  const ax1=xs[i]+0.12*s, ax2=xs[i]+0.88*s, ay1=y0+Math.max(3,0.14*p.H), ay2=ay1+Math.min(0.5*(ax2-ax1),0.12*p.H);
  const my=y=>2*y0+p.H-y; // mirror across the horizontal midline of the panel
  arrow(ax1,ay1,ax2,ay2);
  arrow(mx(ax1),ay1,mx(ax2),ay2);

  const gLo=snap(Math.ceil,Math.max(GAP_MIN,(h-P.W)/3,2*P.W+2*h-PWd,gForLen),4);
  if(gFix){if(P.g>=gLo-1e-9&&P.g<=gHi+1e-9)return true}

 doc.viewerPreferences({PrintScaling:'None'}); // print dialogs that honour it default to Actual size (stays on even when the printed guide is switched off)
 const pages=which==='both'?[1,2]:[+which];
 pages.forEach((pg,i)=>{
  if(i)doc.addPage([PW,PH],'landscape');
  doc.setDrawColor(0);doc.setTextColor(0);doc.setFont('helvetica','normal');doc.setFontSize(9);
  const items=build(P,pg).it;
  items.forEach(o=>{
   if(o.lw)doc.setLineWidth(o.lw);
   doc.setLineDashPattern(o.dash?DASH:[],0);
   if(o.k==='rect'){if(o.fill){doc.setFillColor(242,242,242);doc.rect(o.x,o.y,o.w,o.h,'F')}else doc.rect(o.x,o.y,o.w,o.h,'S')}
   else if(o.k==='poly'){ // closed polygon: jsPDF wants the first point plus relative steps
    const [a,...r]=o.pts,rel=r.map((q,i)=>[q[0]-(i?r[i-1][0]:a[0]),q[1]-(i?r[i-1][1]:a[1])]);
    if(o.fill)doc.setFillColor(242,242,242);
    doc.lines(rel,a[0],a[1],[1,1],o.fill?'F':'S',true);
   }
   else if(o.k==='line')doc.line(o.x1,o.y1,o.x2,o.y2);
   else if(o.k==='circle')doc.circle(o.cx,o.cy,o.r,'S');
   else doc.text(o.t,o.x,o.y,o.rot?{align:'center',angle:90}:{align:'center'});
  });
  if(scaleGuideOn())drawScaleWarning(doc,items,PW,PH);
 });
 return doc.output('arraybuffer');
}

async function save(filename,data){
 let dl=null;try{dl=await claude.use('downloads')}catch(e){}
 if(dl){
  try{await dl.save({filename,data});note('Saved '+filename)}
  catch(e){if(e&&e.code==='declined')note('Download cancelled.');else note('Could not save the file ('+(e&&e.code||'error')+').',true)}
  return;
 }
 // Standard browser download (works when opened outside claude.ai)
 try{
  const type=filename.endsWith('.pdf')?'application/pdf':'image/svg+xml';
  const url=URL.createObjectURL(new Blob([data],{type}));
  const a=document.createElement('a');
  a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  note('Saved '+filename);
 }catch(e){note('Could not save the file.',true)}
}

function name(ext,tag){return `actuator-stencil-${P.W}x${P.H}-h${P.h}-g${P.g}${tag}.${ext}`}

// controls
(function(){
 const c=document.getElementById('ctl');
 const fh=f=>`<div class="f"><label for="n_${f.k}"><span>${f.name}${f.tip?` <span class="tip" tabindex="0" title="${f.tip}">ⓘ</span>`:''}</span></label><small>${f.hint}</small>
  <div class="row"><input type="range" id="r_${f.k}" min="${f.min}" max="${f.max}" step="${f.step}" value="${P[f.k]}"><span class="nw"><input class="num" type="number" id="n_${f.k}" min="${f.min}" max="${f.max}" step="${f.step}" value="${fmt(f.k,P[f.k])}"><span class="u">mm</span></span><span class="ls">${'hWgH'.includes(f.k)?'<button type="button" class="rst lk" id="lock_'+f.k+'" aria-label="Lock '+({h:'Height',W:'Width',g:'Panel gap',H:'Length'})[f.k]+'" aria-pressed="false">'+ICON_OPEN+'</button>':''}</span>${'gdxHWh'.includes(f.k)?`<button type="button" class="rst ic" id="x_${f.k}" aria-label="Reset to default" title="Reset to default">${ICON_RESET}</button>`:''}</div>${f.k==='h'?'<small id="hint_h"></small>':''}${f.k==='H'?'<small id="hint_H"></small>':''}</div>`;
 const grp=(t,ks)=>`<fieldset class="grp"><legend>${t}</legend>${FIELDS.filter(f=>ks.includes(f.k)).map(fh).join('')}</fieldset>`;
 const adv=()=>`<details class="grp"><summary>Advanced</summary>${FIELDS.filter(f=>'gdx'.includes(f.k)).map(fh).join('')}</details>`;
 c.innerHTML=grp('Actuator dimensions',['H','W','h'])+adv();
 FIELDS.forEach(f=>{
  const r=document.getElementById('r_'+f.k),n=document.getElementById('n_'+f.k);
  const set=v=>{v=parseFloat(v);if(!isFinite(v))return false;P[f.k]=Math.min(+r.max,Math.max(+r.min,v));if(f.k==='h'){if(P.wL==null)P.W=Math.max(P.W,Math.min(100,snap(Math.ceil,P.h-3*P.g,2)));P.h=Math.min(P.h,P.W+3*P.g)}if(f.k==='H')P.wantH=P.hL==null?P.H:Math.min(P.H,hmFor());if(f.k==='d')P.wantD=P.d;if(f.k==='h')P.wantS=Math.max(4,(P.h-3*P.g)/2);P.mv=f.k;return true};
  r.addEventListener('input',()=>{set(r.value);n.value=fmt(f.k,P[f.k]);render()});
  n.addEventListener('input',()=>{if(set(n.value)){r.value=P[f.k];render()}});
  n.addEventListener('change',()=>{n.value=fmt(f.k,P[f.k])});
  const x=document.getElementById('x_'+f.k);
  if(x)x.addEventListener('click',()=>{if(set(DEF[f.k])){r.value=P[f.k];n.value=fmt(f.k,P[f.k]);render()}});
 });
 // Clicking a "Folding page has reached the paper ..." hint (under Length or Height) jumps to the Folding tab
 ['hint_H','hint_h'].forEach(id=>{const hh=document.getElementById(id);
  if(hh){hh.setAttribute('role','button');hh.tabIndex=0;
   const go=()=>{if(hh.textContent&&page!==2){page=2;render()}};
   hh.addEventListener('click',go);
   hh.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}})}});
 const lk=document.getElementById('lock_h');
 if(lk)lk.addEventListener('click',()=>{P.mv=null;if(P.hL==null){P.hL=P.h}else{P.hL=null;P.wantS=P.s}render()});
 // Dragging a slider switches all number boxes to the fixed-decimal display; releasing it switches back
 {const refreshNumbers=()=>FIELDS.forEach(f=>syncField(f.k));
  const start=e=>{if(e.target&&e.target.matches&&e.target.matches('input[type=range]')&&!sliding){sliding=true;refreshNumbers()}};
  const end=()=>{if(sliding){sliding=false;refreshNumbers()}};
  document.addEventListener('pointerdown',start,true);
  ['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,end,true));
  window.addEventListener('blur',end);}
 // Preview zoom: buttons, Ctrl/⌘ + scroll (also trackpad pinch), drag to pan, double-click to zoom in / reset
 {const sh=document.getElementById('sheet'),on=(id,fn)=>{const b=document.getElementById(id);if(b)b.addEventListener('click',fn)};
  const frac=e=>{const r=(sh.querySelector('svg')||sh).getBoundingClientRect();return r.width&&r.height?[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]:[.5,.5]};
  on('zin',()=>zoomAt(1.5));on('zout',()=>zoomAt(1/1.5));on('zfit',resetView);
  sh.addEventListener('wheel',e=>{if(!(e.ctrlKey||e.metaKey))return;e.preventDefault();const [fx,fy]=frac(e);zoomAt(Math.exp(-e.deltaY*(e.deltaMode===1?0.05:0.0025)),fx,fy)},{passive:false});
  sh.addEventListener('dblclick',e=>{const [fx,fy]=frac(e);const c=shownCentre();if(VIEW.z!==1||c.cx!==.5||c.cy!==pageMid(page))resetView();else zoomAt(2.5,fx,fy)});
  let drag=null;
  sh.addEventListener('pointerdown',e=>{if(!sh.classList.contains('pannable')||e.button!==0)return;stopGlide();drag={x:e.clientX,y:e.clientY};sh.setPointerCapture(e.pointerId);sh.classList.add('panning')});
  sh.addEventListener('pointermove',e=>{if(!drag)return;const r=(sh.querySelector('svg')||sh).getBoundingClientRect();if(!r.width||!r.height)return;
   const f=1/VIEW.z;commitCentre();VIEW.cx-=(e.clientX-drag.x)/r.width*f;VIEW.cy-=(e.clientY-drag.y)/r.height*f;commitCentre();drag.x=e.clientX;drag.y=e.clientY;applyView();syncTabToView()});
  const stop=()=>{drag=null;sh.classList.remove('panning')};
  sh.addEventListener('pointerup',stop);sh.addEventListener('pointercancel',stop);}
 // The Scale guide button shows / hides the guide in the preview as well as in the PDF
 {const sg=document.getElementById('scaleguide');
  if(sg){
   const paint=()=>{const on=scaleGuideOn();sg.classList.toggle('off',!on);sg.innerHTML=on?ICON_EYE:ICON_EYE_OFF;
    sg.title=on?'Scale guide: ON. A note at the top of each page asks to print at 100% (Actual Size), with a 100 mm guide to check the printed scale when it fits. Click to turn off.'
              :'Scale guide: OFF. Click to add a print-at-100% note and a 100 mm guide to the preview and the PDF.'};
   paint();
   sg.addEventListener('click',()=>{sg.setAttribute('aria-pressed',String(!scaleGuideOn()));paint();render()});
  }}
 // Lock buttons for Length, Panel gap and Width: lock at the current value, or unlock
 [['H','HL'],['g','gL'],['W','wL']].forEach(([k,lk])=>{
  const b=document.getElementById('lock_'+k);
  if(b)b.addEventListener('click',()=>{P.mv=null;P[lk]=P[lk]==null?P[k]:null;render()});
 });
 document.getElementById('paper').addEventListener('change',e=>{P.mv=null;P.paper=e.target.value;render()});
 // Any interaction with the Advanced section (summary, sliders, number fields, reset buttons) shows the Folding tab
 const advEl=c.querySelector('details.grp');
 if(advEl){
  const toFolding=()=>{if(page!==2){page=2;render()}};
  ['pointerdown','focusin','input','click'].forEach(ev=>advEl.addEventListener(ev,toFolding));
 }
})();
(function(){
 const dlg=document.getElementById('about'),ul=document.getElementById('contribList');
 CONTRIBUTORS.forEach(c=>{
  const li=document.createElement('li'),n=document.createElement('span'),r=document.createElement('span');
  r.className='cr';r.textContent=c.role?' \u2014 '+c.role:'';
  if(c.url&&/^https?:\/\//i.test(c.url)){const a=document.createElement('a');a.href=c.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=c.name;n.appendChild(a)}
  else n.textContent=c.name;
  li.append(n,r);ul.appendChild(li);
 });
 document.getElementById('aboutBtn').addEventListener('click',()=>dlg.showModal());
 document.getElementById('aboutClose').addEventListener('click',()=>dlg.close());
 dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});
})();
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{page=+t.dataset.pg;render()}));
document.getElementById('dlpdf').addEventListener('click',()=>{
 if(!window.jspdf){note('The PDF library did not load.',true);return}
 save(name('pdf',''),pdf('both'));
});
document.getElementById('dlsvg').addEventListener('click',()=>save(name('svg','-p'+page),svg(P,page,'#000')));
render();
</script>
